name: Sync from template and deploy

on:
  # Fired by the template repo once its tests pass. This is the only automatic
  # trigger: if it stops firing, this repo goes stale until someone runs the
  # workflow by hand.
  repository_dispatch:
    types: [template-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt giter8

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Rendered outside the checkout: anything under it is picked up by `git add -A` below, which is how
      # a full duplicate of this repo used to end up committed under rendered/.
      - name: Render latest template
        run: g8 linux-root/tyrian-flowbite.g8 --backend=yes -o "$RUNNER_TEMP/rendered" </dev/null

      # Runs before the compile step on purpose: the check copies the tree into the Nix store, and after
      # sbt has run that tree also holds every target/ directory.
      - name: Verify the generated flake evaluates
        working-directory: ${{ runner.temp }}/rendered
        run: nix flake check --no-build

      - name: Verify it compiles
        working-directory: ${{ runner.temp }}/rendered
        run: sbt -batch backend/compile frontend/compile </dev/null

      # --delete makes this repo byte-identical to the fresh render, so the excludes carry real weight:
      # .git keeps the history, this workflow is not part of the template and would delete itself, and
      # the template's own .gitignore keeps out the target/ dirs the compile step just created.
      - name: Sync rendered output into this repo
        run: rsync -a --delete --exclude='.git' --exclude='.github/workflows/sync-and-deploy.yml' --exclude-from="$RUNNER_TEMP/rendered/.gitignore" "$RUNNER_TEMP/rendered/" .

      - name: Commit if changed
        id: diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync from linux-root/tyrian-flowbite.g8"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # sync just pushed a commit; github.sha is still the pre-sync one, so an
      # unpinned checkout would build and deploy the previous template version.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt

      # BACKEND_BASE_URL is read at BUILD time, via sbt-buildinfo, and compiled into the JavaScript --
      # setting it on the running backend does nothing. Without it the bundle calls http://localhost:8080,
      # which is what every visitor's browser then tries to reach.
      - name: Build static site (frontend only; the backend is deployed separately)
        run: sbt frontend/publishDist
        env:
          BACKEND_BASE_URL: https://tyrian-api.w47s0n.dev

      - name: Custom domain + SPA fallback for client-side routing
        run: |
          echo 'tyrian-fullstack.w47s0n.dev' > frontend/dist/CNAME
          cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
