name: Sync from template and deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt giter8

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Render latest template
        run: g8 linux-root/tyrian-flowbite.g8 --backend=yes -o rendered </dev/null

      # Runs before the compile step on purpose: the check copies the tree into the Nix store, and after
      # sbt has run that tree also holds every target/ directory.
      #
      # The `path:` prefix bypasses Nix's git-tree handling. `rendered/` sits inside this repo's checkout,
      # and for a flake under a git repository Nix sees only tracked files -- so a plain reference fails
      # with "not tracked by Git" before evaluating anything.
      - name: Verify the generated flake evaluates
        run: nix flake check --no-build "path:$PWD/rendered"

      - name: Verify it compiles
        working-directory: rendered
        run: sbt -batch backend/compile frontend/compile </dev/null

      - name: Sync rendered output into this repo
        run: rsync -a --delete --exclude='.git' --exclude='/rendered' --exclude='.github/workflows/sync-and-deploy.yml' --exclude-from='rendered/.gitignore' rendered/ .

      - name: Commit if changed
        id: diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync from linux-root/tyrian-flowbite.g8"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt

      # BACKEND_BASE_URL is read at BUILD time, via sbt-buildinfo, and compiled into the JavaScript --
      # setting it on the running backend does nothing. Without it the bundle calls http://localhost:8080,
      # which is what every visitor's browser then tries to reach.
      - name: Build static site (frontend only; the backend is deployed separately)
        run: sbt frontend/publishDist
        env:
          BACKEND_BASE_URL: https://tyrian-api.w47s0n.dev

      - name: Custom domain + SPA fallback for client-side routing
        run: |
          echo 'tyrian-fullstack.w47s0n.dev' > frontend/dist/CNAME
          cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
